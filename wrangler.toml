name = "hkjc-data-worker"
main = "src/index.ts"
compatibility_date = "2025-04-17"
compatibility_flags = ["nodejs_compat"]

# workers.dev fallback remains enabled (default). Custom domain on Buzzbus zone:
routes = [
  { pattern = "hkjc.cf-connect.top", custom_domain = true }
]

# Local / default vars (secrets must be set via `wrangler secret put` or .dev.vars)
[vars]
POLL_INTERVAL_MS = "3000"
DAILY_REQUEST_BUDGET = "30000"
BACKFILL_DAYS = "60"
TIMEZONE = "Asia/Hong_Kong"
LIVE_PUSH_ENABLED = "false"
BACKFILL_SOURCE = "graphql"
HORSE_REFRESH_BATCH = "15"
CIRCUIT_BREAKER_THRESHOLD = "10"
CIRCUIT_BREAKER_429_THRESHOLD = "3"
SUBREQUEST_BUDGET = "45"
PUSH_RATE_PER_SUB_PER_SEC = "2"
PUSH_BACKLOG_COALESCE_MIN = "2"
PUSH_BACKLOG_MAX_CHANGES = "200"
PUSH_FULL_SNAPSHOT_INTERVAL_SEC = "300"
PUSH_COALESCE_MS = "2000"
HEARTBEAT_INTERVAL_SEC = "300"
OFFDAY_HEARTBEAT_INTERVAL_SEC = "1800"
RACEDAY_WINDOW_BEFORE_SEC = "7200"
# Soft daily D1 rows-written budget (UTC). Above 80% skip non-essential writes.
D1_DAILY_WRITE_BUDGET = "40000000"
# PUSH_TARGET_URL / API_TOKEN / PUSH_SECRET are secrets — never hardcode here

[[d1_databases]]
binding = "DB"
database_name = "hkjc"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "MEETING_DO", class_name = "MeetingPoller" }
]

[[migrations]]
tag = "v1"
new_classes = ["MeetingPoller"]

# ---------------------------------------------------------------------------
# Cloudflare Queue: one (event, subscriber) delivery per consumer invocation.
# Create the queue once per account (production wrangler.toml is kept separately
# by the deployer — this is the repo template only):
#
#   npx wrangler queues create hkjc-push-deliveries
#
# Binding name: PUSH_QUEUE  |  Queue name: hkjc-push-deliveries
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "hkjc-push-deliveries"

[[queues.consumers]]
queue = "hkjc-push-deliveries"
max_batch_size = 1
max_retries = 5
retry_delay = 60

[triggers]
crons = ["0 * * * *"]

[dev]
port = 8787
